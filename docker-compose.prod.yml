services:

  # ───────────────────────── POSTGRES ─────────────────────────
  postgres:
    image: postgres:17.2-alpine3.21
    container_name: engipilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engipilot}
      POSTGRES_USER: ${POSTGRES_USER:-engipilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engipilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engipilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────── REDIS ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: engipilot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────── KAFKA ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.6
    container_name: engipilot-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.6
    container_name: engipilot-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ───────────────────────── MINIO ─────────────────────────
  minio:
    image: minio/minio
    container_name: engipilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ───────────────────────── BACKEND ─────────────────────────
  backend:
    build:
      context: ./backend
    container_name: engipilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-engipilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-engipilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-engipilot}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      CORS_ALLOWED_ORIGINS: "https://www.engipilot.ma,https://engipilot.ma"

  # ───────────────────────── FRONTEND ─────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: engipilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ───────────────────────── NGINX (OPTIONNEL PROD) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: engipilot-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# ───────────────────────── VOLUMES ─────────────────────────
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data: