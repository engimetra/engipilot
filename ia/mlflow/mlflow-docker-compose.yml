# Serveur de suivi MLflow pour ENGIPILOT
# Lance le tracking server avec backend PostgreSQL et stockage d'artefacts local.

version: "3.9"

services:
  engipilot-mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: engipilot-mlflow
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
    volumes:
      - ./mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_URI}
      --default-artifact-root /mlflow/artifacts
    networks:
      - engipilot_default

networks:
  engipilot_default:
    external: true
