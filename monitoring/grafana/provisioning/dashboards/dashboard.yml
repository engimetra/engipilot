# Fournisseur de tableaux de bord Grafana — chargement automatique depuis le dossier dashboards
apiVersion: 1

providers:
  - name: engipilot-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
