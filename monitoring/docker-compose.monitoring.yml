# Stack de supervision ENGIPILOT — Grafana + Prometheus + exporteurs
# Démarrage : docker compose -f monitoring/docker-compose.monitoring.yml --env-file monitoring/.env.monitoring up -d

version: "3.9"

services:

  # ─── PROMETHEUS ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: engipilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - engipilot_default

  # ─── GRAFANA ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: engipilot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme_grafana_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - engipilot_default

  # ─── NODE EXPORTER (métriques système hôte) ──────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: engipilot-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - engipilot_default

  # ─── CADVISOR (métriques conteneurs Docker) ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: engipilot-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - engipilot_default

  # ─── POSTGRES EXPORTER (métriques base de données) ───────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: engipilot-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://admin:password@postgres:5432/engipilot?sslmode=disable}
    networks:
      - engipilot_default

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Réseau partagé avec le compose principal
  engipilot_default:
    external: true
