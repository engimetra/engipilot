global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Backend Spring Boot (Actuator Prometheus)
  - job_name: engipilot-backend
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /actuator/prometheus

  # Service IA FastAPI
  - job_name: engipilot-ia
    static_configs:
      - targets: ['ia:8000']
    metrics_path: /metrics

  # Frontend Next.js
  - job_name: engipilot-frontend
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: /metrics

  # Exporteur PostgreSQL
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
